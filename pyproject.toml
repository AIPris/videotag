[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videotag"
dynamic = ["version"]
description = "Local AI video tagging and face recognition for Synology Photos, with English and German descriptions."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["synology", "synology-photos", "video-tagging", "face-recognition", "local-ai", "video-search", "video-captioning"]
dependencies = [
    "numpy",
    "opencv-python",
    "requests",
    "keyring",
]

[project.optional-dependencies]
# The bilingual descriptions. Install a CUDA build of torch first (https://pytorch.org), then `pip install ".[describe]"`.
describe = ["torch", "transformers", "accelerate", "pyyaml", "pillow"]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/AIPris/videotag"
Documentation = "https://github.com/AIPris/videotag/blob/main/docs/howto.md"
Repository = "https://github.com/AIPris/videotag"
Issues = "https://github.com/AIPris/videotag/issues"
Roadmap = "https://github.com/AIPris/videotag/blob/main/docs/roadmap.md"

[project.scripts]
videotag = "videotag.cli:main"

[tool.setuptools]
packages = ["videotag"]

[tool.setuptools.package-data]
videotag = ["gui_assets/*"]  # the page of `videotag gui`

[tool.setuptools.dynamic]
version = { attr = "videotag.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"videotag/describe.py" = ["E501"]  # the model prompt is one long block of text on purpose
