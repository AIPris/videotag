<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title description">
  <title id="title">videotag — Make your videos searchable</title>
  <desc id="description">Local AI for Synology Photos. An illustrated lakeside video is annotated with a person match and searchable topics. Runs on your PC, with English and German descriptions.</desc>
